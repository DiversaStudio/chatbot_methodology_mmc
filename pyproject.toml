[project]
name = "chatbot-methodology-mmc"
version = "0.1.0"
description = "Methodology, EDA notebooks and analysis code for the MMC WhatsApp chatbot for migrants in Colombia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "missingno>=0.5",
    "wordcloud>=1.9",
    "geopandas>=1.0",
    "osmnx>=2.0",
    "shapely>=2.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[tool.uv]
# This is a notebook/analysis project, not an installable library --
# don't build/install it as a package (avoids uv treating src/ as a
# package source root during sync).
package = false

